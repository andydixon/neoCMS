<!DOCTYPE html>
<html lang="en-gb">
<head>
    <!-- A repeatable-content starter template for listings, teams, services, and similar pages. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New NeoCMS Listing</title>
    <meta name="description" content="Describe this listing for visitors and search engines.">
</head>
<body>
<header class="editable">
    <h1>New listing</h1>
    <p>Edit this introduction, then duplicate the example item below as required.</p>
</header>

<main>
    <!-- neo-dupe adds clone-before, clone-after, and delete controls in the CMS preview. -->
    <article class="editable neo-dupe">
        <h2>Example item</h2>
        <p>Replace this content or duplicate the complete item.</p>
    </article>
</main>
</body>
</html>
