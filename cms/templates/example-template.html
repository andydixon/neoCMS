<!DOCTYPE html>
<html lang="en-gb">
<head>
    <!-- Replace these metadata values through the CMS SEO dialogue after creating the page. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New NeoCMS Page</title>
    <meta name="description" content="Describe this page for visitors and search engines.">
</head>
<body>
<!-- The default editable class may be changed with editableClass in cms/config.php. -->
<main class="editable">
    <h1>New page</h1>
    <p>Select this region in NeoCMS to replace the example content.</p>
</main>

<!-- Shared keys allow one saved block to update every matching page. -->
<footer class="editable" data-neo-shared="site-footer">
    <p>Shared site footer</p>
</footer>
</body>
</html>
